worker_processes  4;
daemon            on;
pid               nginx.pid;
error_log         error.log info;

events {}

http {
    access_log  off;

    hits_zone  pages  32k;

    server {
        listen  127.0.0.1:8088;
        root    html;

        hits  pages;

        location / {
        }

        location = /hits {
            hits         off;
            hits_status  pages;
        }
    }
}
